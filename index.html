<!DOCTYPE html>
<html lang="es">          
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación por Pares</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


<style type="text/tailwindcss">

  @import "tailwindcss";

   @layer base {

     :root {

      @apply text-sm;

       line-height: 1.5;
     }
  }


</style>

</head>
<body class="bg-[#3B7597] min-h-screen font-sans p-3 sm:p-4 md:p-8 flex flex-col items-center">

    <!-- Contenedor Principal Adaptable (Diseño Orientado al Usuario) -->
    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl p-4 sm:p-6 md:p-8 mt-6 sm:mt-12 text-center">
        
        <!-- Encabezado -->
        <header class="text-center mb-6 sm:mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-violet-600 md:text-4xl tracking-tight">Evaluación por Pares</h1>
            <p class="text-gray-700 text-xs sm:text-sm mt-2 font-medium">Asignación aleatoria para la revisión del Dashboard de repaso de funciones.</p>
        </header>

        <!-- Sección de Control Flexible -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-gray-200 pb-6 mb-6 text-left w-full">
            <div class="w-full sm:w-auto">
                <h2 class="text-base sm:text-lg font-bold text-gray-700">- Integrantes en la clase:</h2>
                <p id="lista-integrantes" class="text-xl sm:text-sm text-black mt-1 italic font-medium">Cargando integrantes...</p>
            </div>
            <button id="btn-asignar" type="button" class="w-full sm:w-auto cursor-pointer bg-blue-600 hover:bg-orange-800 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 shadow-md active:scale-95 text-center text-sm sm:text-base whitespace-nowrap">
                Generar Revisiones
            </button>
        </div>

        <!-- Vista de Resultados (Grid Responsivo) -->
        <main class="w-full">
            <h3 class="text-lg sm:text-xl font-black text-gray-800 mb-4 text-left font-sans">Panel de Revisiones Asignadas</h3>
            
            <!-- Grid: 1 columna en móvil, 2 en tablets, 3 en escritorio de forma elástica -->
            <div id="grid-revisiones" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
                <!-- Las tarjetas dinámicas se inyectarán aquí mediante el archivo app.js -->
                <div class="col-span-full text-center text-gray-400 py-12 border-2 border-dashed border-gray-200 rounded-xl font-medium text-sm">
                    Presiona el botón para generar las asignaciones.
                </div>
            </div>
        </main>
    </div>

    <!-- ÚNICA VINCULACIÓN JAVASCRIPT AL FINAL -->
    <script src="./js/app.js"></script>
</body>
</html>
